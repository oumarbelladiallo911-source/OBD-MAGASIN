name: Build Android APK (Kivy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des dépendances système requises par Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake zip unzip
        sudo apt-get install -y openjdk-17-jdk
        pip install --upgrade pip
        pip install cython buildozer toolbelt

    - name: Build de l'APK avec Buildozer
      id: buildozer
      run: |
        # Force buildozer à accepter les licences Android SDK en mode automatique
        yes | buildozer android debug
      env:
        # Évite les blocages interactifs pendant le build sur GitHub
        CI: true

    - name: Téléchargement de l'APK final (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: MonApplication-Android-APK
        path: bin/*.apk
