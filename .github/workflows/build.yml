name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user user
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          set -o pipefail
          echo y | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
