name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev xclip libtinfo5 \
          cmake intltool libtool pkg-config zlib1g-dev libncurses5-dev \
          libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev libbz2-dev \
          autoconf openjdk-17-jdk unzip zip lld

    - name: Set up Android SDK Environment
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p "$ANDROID_HOME/licenses"
        echo -e "244d2d9e8db31f3b97b4d22e06cf348d28652243\n37b75216962534068b39b1800d14bb0887e21df4\n2b3b858e9647d210925d48dd810e14e1a02d338f\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n8933bad161af4178b1185d1a37fbf41ea5269c55\n659f17331cdd12911b05567b938e5d3297a0b3e5" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "851f5f671f6e6115661da6c533544d1423d6a2cd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.11 kivy

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        TERM: xterm
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        BUILDOZER_ALLOW_ORG_APK: "1"

    - name: Upload APK Artifact
      uses: actions/artifacts@v4
      with:
        name: OBD-Vision-Android-APK
        path: bin/*.apk
