name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: '**/requirements.txt'
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev xclip libtinfo5 \
          cmake intltool libtool shadow-utils pkg-config zlib1g-dev libncurses5-dev \
          libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev libbz2-dev autoheader \
          automake autoconf openjdk-17-jdk unzip zip lld

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.11 kivy

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug
      env:
        TERM: xterm

    - name: Upload APK Artifact
      uses: actions/artifacts@v4
      with:
        name: OBD-Vision-Android-APK
        path: bin/*.apk
