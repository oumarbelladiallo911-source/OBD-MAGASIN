name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          set -eo pipefail
          yes y | buildozer android debug 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

           - name: LA LIGNE OU CA A PLANTE
        if: failure()
        run: |
          echo "===== CHERCHE FPDF2 ET RECIPE ====="
          grep -n -i "recipe\|fpdf2\|no recipe\|failed" build.log | head -n 100
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
