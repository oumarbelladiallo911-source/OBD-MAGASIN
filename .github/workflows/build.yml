name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          set -eo pipefail
          yes y | buildozer android debug 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: LA LIGNE OU CA A PLANTE
        if: failure()
        run: |
          echo "===== LA VRAIE ERREUR EST JUSTE AVANT ====="
          grep -n "Buildozer failed" build.log | tail -n 1
          LIGNE=$(grep -n "Buildozer failed" build.log | tail -n 1 | cut -d: -f1)
          DEBUT=$((LIGNE - 80))
          if [ $DEBUT -lt 1 ]; then DEBUT=1; fi
          sed -n "${DEBUT},${LIGNE}p" build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
